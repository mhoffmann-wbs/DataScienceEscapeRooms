name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Never cancel a running one: a deployment cancelled midway
# can leave Pages stuck in "deployment_queued".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pyodide package wheels for the time series rooms, cached per Pyodide version.
      - uses: actions/cache@v6
        with:
          path: vendor/pyodide
          key: pyodide-packages-${{ hashFiles('package-lock.json', 'content/rooms/*/manifest.json') }}
      - run: npm run fetch-packages
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
